spring:
  application:
    name: home-network-monitor
  datasource:
    url: jdbc:h2:file:./data/home-network-monitor;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

vsol:
  base-url: http://192.168.1.1
  username: ${VSOL_USERNAME:}
  password: ${VSOL_PASSWORD:}

collector:
  interval-ms: 300000

# adguard.base-url fica vazio por padrão (integração desligada) até ser
# definido via variável de ambiente ADGUARD_BASE_URL no deploy real.
adguard:
  base-url: ${ADGUARD_BASE_URL:}
  username: ${ADGUARD_USERNAME:}
  password: ${ADGUARD_PASSWORD:}
  querylog-fetch-limit: 500

dnslog:
  interval-ms: 60000

